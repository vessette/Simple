# Publishes the project's four public pages to GitHub Pages, and nothing else:
#   /                     artifacts/vick-weekly-update.html
#   /roadmap.html         artifacts/vick-project-roadmap.html
#   /capability-map.html  artifacts/vick-capability-map.html
#   /workflows.html       artifacts/vick-workflows.html
name: Publish project pages

on:
  push:
    branches: [main]
    paths:
      - artifacts/vick-weekly-update.html
      - artifacts/vick-project-roadmap.html
      - artifacts/vick-capability-map.html
      - artifacts/vick-workflows.html
      - .github/workflows/publish-weekly-update.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Each file is a page body written for claude.ai, which adds the document head.
      # Add the same head here so it renders the same on its own. A missing source fails the build.
      - name: Build the site
        run: |
          set -euo pipefail
          mkdir -p _site
          page() {
            test -f "artifacts/$1"
            {
              printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n'
              printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
              cat "artifacts/$1"
            } > "_site/$2"
          }
          page vick-weekly-update.html   index.html
          page vick-project-roadmap.html roadmap.html
          page vick-capability-map.html  capability-map.html
          page vick-workflows.html       workflows.html
          ls -l _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
