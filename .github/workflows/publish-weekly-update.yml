# Publishes only artifacts/vick-weekly-update.html to GitHub Pages, as the site's index page.
# Nothing else in the repository goes on the site.
name: Publish weekly update

on:
  push:
    branches: [main]
    paths:
      - artifacts/vick-weekly-update.html
      - .github/workflows/publish-weekly-update.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The file is a page body written for claude.ai, which adds the document head.
      # Add the same head here so it renders the same on its own.
      - name: Build the one-page site
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            cat artifacts/vick-weekly-update.html
          } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
